spec_version: "0.1.0"
name: "ai-adaptive-onboarding-engine"
version: "1.0.0"
description: "AI-driven adaptive learning engine that parses resumes and job descriptions, identifies skill gaps, and dynamically maps personalized training pathways."
author: "Chithra R"
license: "MIT"

model:
  preferred: "mistralai/Mistral-7B-Instruct-v0.2"
  fallback:
    - "all-MiniLM-L6-v2"
  constraints:
    temperature: 0.2
    max_tokens: 500

skills:
  - "resume-parsing"
  - "job-description-analysis"
  - "skill-gap-analysis"
  - "adaptive-roadmap-generation"

runtime:
  temperature: 0.2
  timeout: 300

compliance:
  risk_tier: "standard"
  frameworks:
    - "eeoc"
    - "gdpr"
  data_governance:
    pii_handling: "redact"
    data_classification: "confidential"
    consent_required: true
    bias_testing: true

tags:
  - "hr"
  - "recruiting"
  - "onboarding"
  - "adaptive-learning"

metadata:
  domain: "HR & recruiting"
  category: "hr-and-recruiting"
  framework: "fastapi"
